context:
  version: "1.2.0"

package:
  name: rfdetr-plus
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/41/d3/5aa587ba7170e6eb718271da5e87b124a26a056d616d61fa531bd8f6f900/rfdetr_plus-${{ version }}.tar.gz
  sha256: 53c7c442f3b6e94658460d1eb747cb82966e24514a97e5a5af015f5fe2bc607d

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - rfdetr >=1.12.0,<2
    - timm >=1.0.27,<2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - rfdetr_plus
      pip_check: true

about:
  homepage: https://github.com/roboflow/rf-detr-plus
  summary: RF-DETR+ extension adding XLarge and 2XLarge detection models by Roboflow
  description: |
    RF-DETR+ is an extension package for RF-DETR that adds the XLarge and 2XLarge
    detection models for maximum accuracy in object detection tasks.
  license: LicenseRef-PML-1.0
  license_file: LICENSE
  repository: https://github.com/roboflow/rf-detr-plus

extra:
  recipe-maintainers:
    - Borda
