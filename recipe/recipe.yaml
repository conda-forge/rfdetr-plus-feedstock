context:
  version: "1.0.2"

package:
  name: rfdetr-plus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rfdetr-plus/rfdetr_plus-${{ version }}.tar.gz
  sha256: 026c33487a6f3300205b1116b2b210fff346f618b5db056ad42fb6517dce3432

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - rfdetr >=1.6.0,<2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - rfdetr_plus
      pip_check: true

about:
  homepage: https://github.com/roboflow/rf-detr-plus
  summary: RF-DETR+ extension adding XLarge and 2XLarge detection models by Roboflow
  description: |
    RF-DETR+ is an extension package for RF-DETR that adds the XLarge and 2XLarge
    detection models for maximum accuracy in object detection tasks.
  license: LicenseRef-PML-1.0
  license_file: LICENSE
  repository: https://github.com/roboflow/rf-detr-plus

extra:
  recipe-maintainers:
    - Borda
