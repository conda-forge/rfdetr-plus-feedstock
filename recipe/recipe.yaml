context:
  version: "1.1.0"

package:
  name: rfdetr-plus
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/c0/96/ba4b874e76a5458cccbe0589020fa778e70a007462dae771c93ba8eed83f/rfdetr_plus-${{ version }}.tar.gz
  sha256: 7471b983e69aa23e14d6721e501938444575a9b50c22e28ec528df497f8145a2

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - rfdetr >=1.6.0,<2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - rfdetr_plus
      pip_check: true

about:
  homepage: https://github.com/roboflow/rf-detr-plus
  summary: RF-DETR+ extension adding XLarge and 2XLarge detection models by Roboflow
  description: |
    RF-DETR+ is an extension package for RF-DETR that adds the XLarge and 2XLarge
    detection models for maximum accuracy in object detection tasks.
  license: LicenseRef-PML-1.0
  license_file: LICENSE
  repository: https://github.com/roboflow/rf-detr-plus

extra:
  recipe-maintainers:
    - Borda
