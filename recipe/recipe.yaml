context:
  version: "1.3.0"

package:
  name: rfdetr-plus
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/07/e6/163ce3e45290744e7c2af308081f7abef2e7ad0bfe3c1104c00bff126d94/rfdetr_plus-${{ version }}.tar.gz
  sha256: 85c7ad6a2f75dc01bd3b62a42aa36684b2ae6eecf54a3bbe6f568b91cbd8413b

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=42
    - wheel
  run:
    - python >=${{ python_min }}
    - rfdetr >=1.12.0,<2
    - timm >=1.0.27,<2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - rfdetr_plus
      pip_check: true

about:
  homepage: https://github.com/roboflow/rf-detr-plus
  summary: RF-DETR+ extension adding XLarge and 2XLarge detection models by Roboflow
  description: |
    RF-DETR+ is an extension package for RF-DETR that adds the XLarge and 2XLarge
    detection models for maximum accuracy in object detection tasks.
  license: LicenseRef-PML-1.0
  license_file: LICENSE
  repository: https://github.com/roboflow/rf-detr-plus

extra:
  recipe-maintainers:
    - Borda
